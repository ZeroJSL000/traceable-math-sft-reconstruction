[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traceable-math-sft-reconstruction"
version = "0.1.0"
description = "Report-guided reconstruction of an auditable math SFT data pipeline"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
traceable-math-sft = "traceable_math_sft.__main__:main"

[tool.setuptools]
packages = ["traceable_math_sft"]
